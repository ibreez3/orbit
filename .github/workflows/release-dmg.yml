name: Release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload"
        required: true
      update_appcast:
        description: "Update stable appcast (ignored for preview tags)"
        required: true
        type: boolean
        default: true
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: orbit-release
  cancel-in-progress: false

jobs:
  build-and-upload-dmg:
    name: Build and upload Apple Silicon DMG
    runs-on: macos-15

    env:
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE="true"
          else
            STABLE="false"
          fi
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=Orbit-${TAG}-AppleSilicon.dmg" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version | grep -q "Xcode 26.3"

      - name: Validate release versions
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BASE_VERSION: ${{ steps.release.outputs.base_version }}
          STABLE: ${{ steps.release.outputs.stable }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          from pathlib import Path

          def value(text, key):
              match = re.search(r'^\s*' + key + r':\s*"?([^"\s]+)"?\s*$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"::error::Missing {key} in project.yml")
              return match.group(1)

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag):
              raise SystemExit("::error::Invalid release tag")
          source = Path("orbit-app/project.yml").read_text()
          marketing = value(source, "MARKETING_VERSION")
          build = value(source, "CURRENT_PROJECT_VERSION")
          if marketing != os.environ["BASE_VERSION"]:
              raise SystemExit("::error::MARKETING_VERSION does not match the tag's base version")
          if not re.fullmatch(r"[0-9]+", build) or int(build) <= 0:
              raise SystemExit("::error::CURRENT_PROJECT_VERSION must be a positive integer")
          parent = subprocess.run(["git", "rev-parse", "--verify", f"{tag}^"], capture_output=True, text=True)
          previous_tag = ""
          previous_build = ""
          if parent.returncode == 0:
              tags = subprocess.check_output(
                  ["git", "tag", "--sort=-creatordate", "--merged", f"{tag}^"], text=True
              ).splitlines()
              previous_tag = next((candidate for candidate in tags if re.fullmatch(
                  r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", candidate
              )), "")
          if previous_tag:
              previous = subprocess.run(
                  ["git", "show", f"{previous_tag}:orbit-app/project.yml"], capture_output=True, text=True
              )
              if previous.returncode == 0:
                  previous_build = value(previous.stdout, "CURRENT_PROJECT_VERSION")
                  if not re.fullmatch(r"[0-9]+", previous_build) or int(build) <= int(previous_build):
                      raise SystemExit(f"::error::Build {build} must exceed {previous_tag} build {previous_build}")
          if os.environ["STABLE"] == "true" and not os.environ.get("SPARKLE_PRIVATE_KEY", "").strip():
              raise SystemExit("::error::Stable releases require SPARKLE_PRIVATE_KEY")
          print(f"tag={tag} stable={os.environ['STABLE']} marketing={marketing} build={build} "
                f"previous_tag={previous_tag or 'none'} previous_build={previous_build or 'none'}")
          PYTHON

      - name: Test appcast tooling
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi
          xcodebuild -version
          rustc --version
          xcodegen --version
          gh --version

      - name: Fetch release notes
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          STABLE: ${{ steps.release.outputs.stable }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/orbit-release-notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$NOTES"; then
            :
          elif [ "$STABLE" = "true" ]; then
            echo "::error::Create the GitHub release with notes before dispatching a stable release"
            exit 1
          else
            printf 'Orbit macOS preview release.\n' > "$NOTES"
          fi
          if [ -z "$(tr -d '[:space:]' < "$NOTES")" ]; then
            echo "::error::Release notes are empty"
            exit 1
          fi

      - name: Build Rust static libraries
        shell: bash
        run: ./scripts/build-rust.sh

      - name: Generate Xcode project
        shell: bash
        working-directory: orbit-app
        run: xcodegen generate

      - name: Test Orbit
        shell: bash
        working-directory: orbit-app
        run: |
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -skipPackagePluginValidation -destination 'platform=macOS' -derivedDataPath "$DERIVED_DATA" test

      - name: Build Orbit.app
        shell: bash
        working-directory: orbit-app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -skipPackagePluginValidation \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath "$DERIVED_DATA" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            build

      # -- Developer ID signing (requires Apple Developer Certificate in Keychain) --
      # - name: Sign with Developer ID
      #   shell: bash
      #   run: |
      #     APP_PATH="$DERIVED_DATA/Build/Products/Release/Orbit.app"
      #     codesign --deep --force --options runtime \
      #       --sign "Developer ID Application: Your Name (TEAMID)" \
      #       --entitlements orbit-app/Orbit/Orbit.entitlements \
      #       "$APP_PATH"

      - name: Verify Orbit.app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release/Orbit.app"
          bash ./scripts/verify-app.sh "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Contents/Info.plist"

      - name: Build and verify DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release/Orbit.app"
          DMG_PATH="$PWD/release/${{ steps.release.outputs.asset }}"
          DMG_ROOT="$(mktemp -d /tmp/orbit-dmg-root.XXXXXX)"
          trap 'rm -rf "$DMG_ROOT"' EXIT

          mkdir -p "$(dirname "$DMG_PATH")"
          rm -f "$DMG_PATH"
          ditto "$APP_PATH" "$DMG_ROOT/Orbit.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "Orbit ${{ steps.release.outputs.tag }}" \
            -srcfolder "$DMG_ROOT" \
            -fs HFS+ \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_PATH"

          codesign --force --sign - "$DMG_PATH"
          codesign --verify --verbose=4 "$DMG_PATH"

          # -- Notarization (requires Apple Developer ID) --
          # xcrun notarytool submit "$DMG_PATH" \
          #   --apple-id "$APPLE_ID" \
          #   --team-id "$APPLE_TEAM_ID" \
          #   --password "$APPLE_APP_SPECIFIC_PASSWORD" \
          #   --wait
          # xcrun stapler staple "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

          MOUNT_DIR="$(mktemp -d /tmp/orbit-dmg.XXXXXX)"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null || true; rmdir "$MOUNT_DIR" 2>/dev/null || true' EXIT
          bash ./scripts/verify-app.sh "$MOUNT_DIR/Orbit.app"
          hdiutil detach "$MOUNT_DIR" -quiet
          trap - EXIT
          rmdir "$MOUNT_DIR"

          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "length=$(wc -c < "$DMG_PATH" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DMG_PATH"

      - name: Sign DMG for Sparkle
        id: sparkle
        if: env.SPARKLE_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          SIGN_UPDATE="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -x "$SIGN_UPDATE" ]; then
            SIGN_UPDATE="$(find "$DERIVED_DATA/SourcePackages" -path '*/Sparkle/bin/sign_update' -type f | head -1)"
          fi
          test -x "$SIGN_UPDATE"

          OUTPUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "${{ steps.dmg.outputs.path }}")"
          echo "$OUTPUT"
          SIGNATURE="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"
          test -n "$SIGNATURE"
          test -n "$LENGTH"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - --verify "${{ steps.dmg.outputs.path }}" "$SIGNATURE"

          echo "sign_update=$SIGN_UPDATE" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ steps.release.outputs.stable }}" = "true" ]; then
              echo "::error::Create the GitHub release with notes before dispatching a stable release"
              exit 1
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orbit $TAG" \
              --latest \
              --notes "Orbit macOS preview release."
          fi
          gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets

      - name: Update appcast on develop
        if: env.SPARKLE_PRIVATE_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.update_appcast)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          ASSET="${{ steps.release.outputs.asset }}"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/Orbit.app"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Contents/Info.plist")"
          SIGN_UPDATE="${{ steps.sparkle.outputs.sign_update }}"
          SPARKLE_SIGNATURE="${{ steps.sparkle.outputs.signature }}"
          SPARKLE_LENGTH="${{ steps.sparkle.outputs.length }}"
          if [ "${{ steps.release.outputs.stable }}" = "true" ]; then
            APPCAST_PATH="docs/appcast.xml"
            PREVIEW_FLAG=""
          else
            APPCAST_PATH="docs/appcast-preview.xml"
            PREVIEW_FLAG="--allow-preview"
          fi
          mkdir -p "$RUNNER_TEMP/orbit-appcast-tools"

          # 构建过程可能改写 tracked 的 Cargo.lock / cbindgen 头文件 / Xcode 工程；
          # 强制丢弃这些改动，避免切换 develop 时被脏工作树阻塞。
          git fetch origin develop
          git switch --discard-changes develop
          git pull --ff-only origin develop
          # 用 develop 上最新的 appcast 工具，确保发布脚本的修复能用于已发布的 tag。
          cp scripts/appcast_lib.py scripts/update-appcast.py "$RUNNER_TEMP/orbit-appcast-tools/"
          # 旧 feed 可能来自上一把签名密钥；验签失败只告警，不能阻断密钥轮换。
          if ! printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - --verify "$APPCAST_PATH"; then
            echo "::warning::Existing appcast does not verify with the current Sparkle key (possible key rotation); regenerating with the current key."
          fi

          python3 "$RUNNER_TEMP/orbit-appcast-tools/update-appcast.py" \
            --appcast "$APPCAST_PATH" $PREVIEW_FLAG \
            --tag "$TAG" --version "$VERSION" --build "$BUILD_VERSION" \
            --url "$URL" --signature "$SPARKLE_SIGNATURE" --length "$SPARKLE_LENGTH" \
            --notes-file "$RUNNER_TEMP/orbit-release-notes.md" \
            --full-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          python3 "$RUNNER_TEMP/orbit-appcast-tools/update-appcast.py" --verify "$APPCAST_PATH" \
            --tag "$TAG" --version "$VERSION" --build "$BUILD_VERSION" $PREVIEW_FLAG

      - name: Sign and push appcast
        if: env.SPARKLE_PRIVATE_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.update_appcast)
        shell: bash
        run: |
          set -euo pipefail
          SIGN_UPDATE="${{ steps.sparkle.outputs.sign_update }}"
          if [ "${{ steps.release.outputs.stable }}" = "true" ]; then
            APPCAST_PATH="docs/appcast.xml"
            PREVIEW_FLAG=""
          else
            APPCAST_PATH="docs/appcast-preview.xml"
            PREVIEW_FLAG="--allow-preview"
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$APPCAST_PATH"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - --verify "$APPCAST_PATH"

          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/Orbit.app"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Contents/Info.plist")"
          python3 "$RUNNER_TEMP/orbit-appcast-tools/update-appcast.py" --verify "$APPCAST_PATH" \
            --tag "$TAG" --version "$VERSION" --build "$BUILD_VERSION" --require-signature $PREVIEW_FLAG

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$APPCAST_PATH"; then
            echo "appcast unchanged"
            exit 0
          fi
          git add "$APPCAST_PATH"
          git commit -m "chore: update appcast for ${{ steps.release.outputs.tag }}"
          git push origin develop || { git pull --rebase origin develop && git push origin develop; }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.asset }}
          path: ${{ steps.dmg.outputs.path }}
