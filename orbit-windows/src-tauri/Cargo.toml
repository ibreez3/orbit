[package]
name = "orbit-windows"
version = "0.1.4"
edition = "2021"
default-run = "orbit-windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orbit-core = { path = "../../orbit-rs" }
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
tokio = { version = "1", features = ["sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials"] }
